name: Notify VPS Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  notify-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to VPS
        run: |
          curl --fail --retry 3 --max-time 15 \
            -X POST http://147.93.180.179:8084/deploy/ \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{}'