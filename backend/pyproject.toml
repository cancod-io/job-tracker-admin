[project]
name = "shopify-job-tracker-backend"
version = "0.1.0"
description = "FastAPI platform API — DB, auth, jobs orchestration (scraping lives in scraping-service/)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Shopify Job Tracker Team" }]

dependencies = [
    # ---- Web framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # ---- Settings & validation ----
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ---- PostgreSQL ----
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",

    # ---- Auth ----
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.9.0",

    # ---- Background scheduling ----
    "apscheduler>=3.10.4",

    # ---- Misc ----
    "python-dateutil>=2.9.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---- Ruff (lint + format) ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends() is fine in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"alembic/env.py" = ["E402"]

# ---- Mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false  # FastAPI decorators are untyped
ignore_missing_imports = true
exclude = ["alembic/versions/"]

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --tb=short"
