[project]
name = "shopify-job-tracker-scraping-service"
version = "0.1.0"
description = "HTML/API collectors and enrichment — Shopify Job Tracker."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Shopify Job Tracker Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "uvicorn[standard]>=0.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "tenacity>=9.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
