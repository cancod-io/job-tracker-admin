name: shopify-job-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: sjt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sjt
      POSTGRES_PASSWORD: sjt
      POSTGRES_DB: shopify_job_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjt -d shopify_job_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sjt-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://sjt:sjt@postgres:5432/shopify_job_tracker
      DATABASE_URL_SYNC: postgresql+psycopg://sjt:sjt@postgres:5432/shopify_job_tracker
      CORS_ORIGINS: "*"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-venv:/opt/venv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      target: dev
    container_name: sjt-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-user:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      target: dev
    container_name: sjt-admin
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend-admin:/app
      - admin-node-modules:/app/node_modules
      - admin-next:/app/.next

volumes:
  postgres-data:
  backend-venv:
  frontend-node-modules:
  frontend-next:
  admin-node-modules:
  admin-next:
